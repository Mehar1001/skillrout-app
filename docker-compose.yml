services:
  # Local development with live reload
  skillrout-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: skillrout-dev
    ports:
      - "8081:8081"
    env_file: .env
    volumes:
      - .:/app
      - /app/node_modules
    command: ["npx", "expo", "start", "--web", "--host", "lan"]

  # Production static web build
  skillrout-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skillrout-web
    ports:
      - "80:80"
